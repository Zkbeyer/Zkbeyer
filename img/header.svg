<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1226"/>
      <stop offset="1" stop-color="#1E2246"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.82" cy="1" r="0.55">
      <stop offset="0" stop-color="#F2A65A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F2A65A" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t{animation:tw 4s ease-in-out infinite}
      .t2{animation:tw 5.5s ease-in-out infinite 1.2s}
      .t3{animation:tw 3.2s ease-in-out infinite .6s}
      @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
      .cur{animation:bl 1.1s steps(1) infinite}
      @keyframes bl{50%{opacity:0}}
      text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}
    </style>
  </defs>
  <rect width="900" height="220" rx="14" fill="url(#sky)"/>
  <rect width="900" height="220" rx="14" fill="url(#lamp)"/>

  <!-- stars -->
  <g fill="#E8E6F5">
    <circle class="t"  cx="70"  cy="34" r="1.4"/>
    <circle class="t2" cx="160" cy="58" r="1"/>
    <circle class="t3" cx="250" cy="26" r="1.2"/>
    <circle class="t"  cx="420" cy="22" r="1"/>
    <circle class="t2" cx="520" cy="44" r="1.4"/>
    <circle class="t3" cx="610" cy="20" r="1"/>
    <circle class="t2" cx="40"  cy="120" r="1"/>
    <circle class="t"  cx="380" cy="64" r="0.9"/>
  </g>

  <!-- window with moon -->
  <g transform="translate(690,30)">
    <rect width="150" height="120" rx="6" fill="#141838" stroke="#3A3F72" stroke-width="3"/>
    <line x1="75" y1="0" x2="75" y2="120" stroke="#3A3F72" stroke-width="3"/>
    <line x1="0" y1="60" x2="150" y2="60" stroke="#3A3F72" stroke-width="3"/>
    <circle cx="110" cy="32" r="14" fill="#F4E9C8"/>
    <circle cx="116" cy="28" r="12" fill="#141838"/>
    <circle class="t3" cx="30" cy="25" r="1.2" fill="#E8E6F5"/>
    <circle class="t" cx="45" cy="88" r="1" fill="#E8E6F5"/>
  </g>
  <!-- desk lamp glow + sill -->
  <rect x="670" y="160" width="190" height="6" rx="3" fill="#2A2F5C"/>
  <circle cx="805" cy="150" r="5" fill="#F2A65A"/>

  <text x="56" y="105" font-size="40" font-weight="700" fill="#F4F1FF">Zack Beyer</text>
  <text x="58" y="140" font-size="17" fill="#B9B4E0">Software Engineer · platform &amp; backend</text>
  <text x="58" y="178" font-size="14" fill="#F2A65A">~/night-shift $ <tspan fill="#8E89C4">go build ./...</tspan><tspan class="cur" fill="#F2A65A"> ▍</tspan></text>
</svg>
